<rect x="24" y="92" width="952" height="106" rx="18" fill="url(#band)" stroke="#ff7a2f" stroke-opacity="0.16" stroke-width="1.2"></rect><line x1="92" y1="145" x2="952" y2="145" stroke="#ff9a5c" stroke-opacity="0.13" stroke-width="1"></line><text x="46" y="139" font-family="&#39;SFMono-Regular&#39;, ui-monospace, &#39;DejaVu Sans Mono&#39;, monospace" font-size="10.5" fill="#ff8a4a" letter-spacing="1.4">01</text><text x="46" y="157" font-family="&#39;SFMono-Regular&#39;, ui-monospace, &#39;DejaVu Sans Mono&#39;, monospace" font-size="10.5" fill="#a89684" letter-spacing="1.1">PROMPTS</text><rect x="196" y="106" width="370" height="78" rx="13" fill="url(#card)" stroke="#ff7a2f" stroke-opacity="0.2" stroke-width="1.2"></rect><circle cx="196" cy="145" r="4.5" fill="#ff7a2f"></circle><circle cx="196" cy="145" r="8" fill="#ff7a2f" fill-opacity="0.18"></circle><text x="220" y="136" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="16.5" font-weight="700" fill="#f6f2ee">Prompts</text><text x="220" y="158" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">System prompts and single-call instructions, drafted</text><text x="220" y="174" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">as ordered operators.</text><rect x="592" y="106" width="370" height="78" rx="13" fill="url(#card)" stroke="#ff7a2f" stroke-opacity="0.2" stroke-width="1.2"></rect><circle cx="592" cy="145" r="4.5" fill="#ff7a2f"></circle><circle cx="592" cy="145" r="8" fill="#ff7a2f" fill-opacity="0.18"></circle><text x="616" y="136" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="16.5" font-weight="700" fill="#f6f2ee">Cognitive-tool scaffolds</text><text x="616" y="158" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">A system prompt plus ready-to-register tool</text><text x="616" y="174" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">definitions for hard reasoning.</text><rect x="24" y="210" width="952" height="106" rx="18" fill="url(#bandhi)" stroke="#ff7a2f" stroke-opacity="0.34" stroke-width="1.2"></rect><line x1="92" y1="263" x2="952" y2="263" stroke="#ff9a5c" stroke-opacity="0.13" stroke-width="1"></line><text x="46" y="257" font-family="&#39;SFMono-Regular&#39;, ui-monospace, &#39;DejaVu Sans Mono&#39;, monospace" font-size="10.5" fill="#ff8a4a" letter-spacing="1.4">02</text><text x="46" y="275" font-family="&#39;SFMono-Regular&#39;, ui-monospace, &#39;DejaVu Sans Mono&#39;, monospace" font-size="10.5" fill="#ffab6a" letter-spacing="1.1">GENERIC</text><text x="46" y="289" font-family="&#39;SFMono-Regular&#39;, ui-monospace, &#39;DejaVu Sans Mono&#39;, monospace" font-size="10.5" fill="#ffab6a" letter-spacing="1.1">AGENTS</text><rect x="196" y="224" width="370" height="78" rx="13" fill="url(#card)" stroke="#ff7a2f" stroke-opacity="0.42" stroke-width="1.2"></rect><circle cx="196" cy="263" r="4.5" fill="#ff7a2f"></circle><circle cx="196" cy="263" r="8" fill="#ff7a2f" fill-opacity="0.18"></circle><text x="220" y="254" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="16.5" font-weight="700" fill="#f6f2ee">Agents</text><text x="546" y="254" text-anchor="end" font-family="&#39;SFMono-Regular&#39;, ui-monospace, &#39;DejaVu Sans Mono&#39;, monospace" font-size="8.5" fill="#ff9a5c" letter-spacing="1.2">AGENTIC</text><text x="220" y="276" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">Full agentic loops — persona, tool contracts, and a</text><text x="220" y="292" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">memory discipline.</text><rect x="592" y="224" width="370" height="78" rx="13" fill="url(#card)" stroke="#ff7a2f" stroke-opacity="0.42" stroke-width="1.2"></rect><circle cx="592" cy="263" r="4.5" fill="#ff7a2f"></circle><circle cx="592" cy="263" r="8" fill="#ff7a2f" fill-opacity="0.18"></circle><text x="616" y="254" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="16.5" font-weight="700" fill="#f6f2ee">Agentic workflows</text><text x="942" y="254" text-anchor="end" font-family="&#39;SFMono-Regular&#39;, ui-monospace, &#39;DejaVu Sans Mono&#39;, monospace" font-size="8.5" fill="#ff9a5c" letter-spacing="1.2">AGENTIC</text><text x="616" y="276" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">Multi-step pipelines — ordered stages, hand-offs,</text><text x="616" y="292" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">and stop conditions.</text><rect x="24" y="328" width="952" height="106" rx="18" fill="url(#band)" stroke="#ff7a2f" stroke-opacity="0.16" stroke-width="1.2"></rect><line x1="92" y1="381" x2="952" y2="381" stroke="#ff9a5c" stroke-opacity="0.13" stroke-width="1"></line><text x="46" y="375" font-family="&#39;SFMono-Regular&#39;, ui-monospace, &#39;DejaVu Sans Mono&#39;, monospace" font-size="10.5" fill="#ff8a4a" letter-spacing="1.4">03</text><text x="46" y="393" font-family="&#39;SFMono-Regular&#39;, ui-monospace, &#39;DejaVu Sans Mono&#39;, monospace" font-size="10.5" fill="#a89684" letter-spacing="1.1">EVALUATORS</text><rect x="196" y="342" width="370" height="78" rx="13" fill="url(#card)" stroke="#ff7a2f" stroke-opacity="0.2" stroke-width="1.2"></rect><circle cx="196" cy="381" r="4.5" fill="#ff7a2f"></circle><circle cx="196" cy="381" r="8" fill="#ff7a2f" fill-opacity="0.18"></circle><text x="220" y="372" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="16.5" font-weight="700" fill="#f6f2ee">Graders &amp; evaluators</text><text x="220" y="394" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">LLM-as-judge rubrics with explicit, checkable</text><text x="220" y="410" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">criteria.</text><rect x="592" y="342" width="370" height="78" rx="13" fill="url(#card)" stroke="#ff7a2f" stroke-opacity="0.2" stroke-width="1.2"></rect><circle cx="592" cy="381" r="4.5" fill="#ff7a2f"></circle><circle cx="592" cy="381" r="8" fill="#ff7a2f" fill-opacity="0.18"></circle><text x="616" y="372" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="16.5" font-weight="700" fill="#f6f2ee">Verifiers</text><text x="616" y="394" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">A verifier spec across three layers, shipped with</text><text x="616" y="410" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#bdae9f">every deliverable.</text>
